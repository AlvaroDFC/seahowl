site_name: SEAHOWL documentation
docs_dir: source
site_dir: ../../build/doc/html/source
theme:
  name: material
  logo: assets/logo_totalenergies.png
  favicon: assets/logo_totalenergies.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.suggest
    - toc.integrate
    - content.code.annotate
    - content.code.copy
    - content.code.fold
    - content.tabs.link
    # - palette.toggle
    - instant
  palette:
    - scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - include-markdown
  - search
  - offline

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg

extra_javascript:
  - js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - css/extra.css

nav:
  - Home: index.md
  - User Guide:
    - Install: INSTALL.md
    - Using package: user-guide/using_package.md
    - Input files:
      - File hierarchy: user-guide/input-files/index.md
      - Main file: user-guide/input-files/main-file.md
      - Turbine file: user-guide/input-files/turbine-file.md
      - Tower file: user-guide/input-files/tower-file.md
      - Blade file: user-guide/input-files/blade-file.md
      - Rna file: user-guide/input-files/rna-file.md
      - Floater file: user-guide/input-files/floater-file.md
      - Environment file: user-guide/input-files/environment-file.md
    - Output files:
      - Generic outputs: user-guide/output-files/output-generic.md
      - Custom outputs: user-guide/output-files/output-custom.md
  - Dev Guide:
    - Contributing: CONTRIBUTING.md
    - Core workflow: dev-guide/core-workflow.md
    - Simulation workflow: dev-guide/sim-workflow.md
    - Prestep — Environmental loads: dev-guide/prestep-env-loads.md
    - Poststep — State synchronization: dev-guide/poststep-state-update.md
    - OpenFAST interface:
      - Overview: dev-guide/architecture/seahowl_openfast_interface.md
      - Module matrix: dev-guide/architecture/tables/openfast_module_matrix.md
    - Chrono interface: dev-guide/architecture/seahowl_chrono_interface.md
    - Vertical axis turbines: dev-guide/vertical-axis-turbines.md
    - From SEAHOWL to SEA-Stack: dev-guide/from_seahowl_to_seastack.md
    - SEA-Stack ↔ Chrono integration: dev-guide/seastack_chrono_integration.md
    - preCICE co-simulation plan: dev-guide/precice_implementation_plan.md
  - C++ API: api/cpp/cpp.md
  - About:
    - Contributors: CONTRIBUTORS.md
    - Licence: LICENSE.md
