site_name: SEAHOWL User Language documentation
docs_dir: user
site_dir: ../build/doc/user
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - navigation.sections
    - search.highlight
    - search.suggest
    - toc.integrate
    - toc.follow
    - content.code.annotate
    - content.code.copy
    - content.code.fold
    - content.tabs.link
    - palette.toggle
    - instant
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: white
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode

plugins:
  - search
  - offline
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_options:
              ignore_init_summary: false
            merge_init_into_class: false
            docstring_style: google
            show_symbol_type_heading: true
            show_symbol_type_toc: true
          paths: ["build"]

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg

extra_javascript:
  - js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - css/extra.css

nav:
  - Home: index.md
  - Quick Start: input-files/index.md
  - Developer Guide:
    - input-files/introduction.md
    - Main: input-files/main-file.md
    - Turbine: input-files/turbine-file.md
    - Environment: input-files/environment-file.md
    - Blade: input-files/blade-file.md
    - Rna: input-files/rna-file.md
    - Tower: input-files/tower-file.md
    - Floater: input-files/floater-file.md
